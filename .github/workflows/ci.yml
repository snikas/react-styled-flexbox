name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        styled-components: [5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save styled-components@${{ matrix.styled-components }}
      # styled-components 5 ships no types, so the source is type-checked against v6 only
      - run: npm run typecheck
        if: matrix.styled-components == 6
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
